 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iniciar Sesión | Barbería Élite del Estilo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        repeating-linear-gradient(135deg, rgba(212,175,55,.035) 0px, rgba(212,175,55,.035) 1px, transparent 1px, transparent 26px),
        linear-gradient(135deg,#0a0a0a,#161616,#000);
    overflow:hidden;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    width:480px;
    height:480px;
    background:#d4af37;
    border-radius:50%;
    top:-200px;
    right:-160px;
    filter:blur(150px);
    opacity:.28;
}

body::after{
    content:"";
    position:absolute;
    width:380px;
    height:380px;
    background:#d4af37;
    border-radius:50%;
    bottom:-190px;
    left:-130px;
    filter:blur(150px);
    opacity:.2;
}

.login-box{
    width:100%;
    max-width:440px;
    padding:20px;
    position:relative;
    z-index:2;
}

.login-card{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border:1px solid rgba(212,175,55,.35);
    border-radius:26px;
    padding:44px 40px;
    box-shadow:0 25px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    position:relative;
    overflow:hidden;
}

.login-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    background:linear-gradient(90deg,transparent,#d4af37,#FFD700,#d4af37,transparent);
}

.logo{
    text-align:center;
    margin-bottom:32px;
}

.logo img{
    width:130px;
    height:130px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
    padding:12px;
    border:2px solid #d4af37;
    box-shadow:0 8px 30px rgba(212,175,55,.35);
    transition:.4s;
}

.logo img:hover{
    transform:scale(1.05) rotate(3deg);
}

.eyebrow{
    display:inline-block;
    color:#d4af37;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    font-weight:600;
    margin-top:18px;
}

.logo h1{
    font-family:'Playfair Display',serif;
    color:#fff;
    font-size:29px;
    font-weight:800;
    margin-top:8px;
    letter-spacing:.5px;
}

.logo p{
    color:#bdbdbd;
    margin-top:8px;
    font-size:14px;
}

.form-label{
    color:#e8e8e8;
    font-weight:600;
    font-size:13px;
    letter-spacing:.5px;
    text-transform:uppercase;
    margin-bottom:8px;
    display:block;
}

.input-group{
    margin-bottom:20px;
}

.input-group-text{
    background:#171717;
    color:#d4af37;
    border:2px solid rgba(212,175,55,.5);
    border-right:none;
    border-radius:12px 0 0 12px;
}

.form-control{
    background:#171717 !important;
    color:#fff !important;
    border:2px solid rgba(212,175,55,.5);
    border-left:none;
    padding:14px;
    border-radius:0 12px 12px 0;
    font-size:15px;
    transition:.3s;
}

.form-control::placeholder{
    color:#8a8a8a;
    font-weight:300;
}

.form-control:focus{
    background:#1e1e1e !important;
    color:#fff !important;
    border-color:#FFD700;
    box-shadow:0 0 18px rgba(255,215,0,.3);
}

.form-control.is-invalid{
    border-color:#ff4d4d;
}

/* Evita que el autocompletado del navegador rompa el diseño oscuro */
.form-control:-webkit-autofill,
.form-control:-webkit-autofill:hover,
.form-control:-webkit-autofill:focus{
    -webkit-box-shadow:0 0 0px 1000px #171717 inset !important;
    -webkit-text-fill-color:#fff !important;
    caret-color:#fff;
    transition:background-color 9999s ease-in-out 0s;
}

.password-box{
    position:relative;
}

.eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#d4af37;
    cursor:pointer;
    font-size:19px;
    z-index:5;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:26px;
}

.form-check-label{
    color:#ccc;
    font-size:14px;
}

.form-check-input{
    border:2px solid #d4af37;
}

.form-check-input:checked{
    background:#d4af37;
    border-color:#d4af37;
}

.forgot{
    color:#d4af37;
    font-size:13px;
    text-decoration:none;
}
.forgot:hover{
    color:#FFD700;
    text-decoration:underline;
}

.btn-login{
    width:100%;
    background:linear-gradient(45deg,#d4af37,#FFD700);
    color:#111;
    font-weight:700;
    letter-spacing:.5px;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    text-transform:uppercase;
    transition:.35s;
}

.btn-login:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(212,175,55,.5);
}

.btn-login:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
}

.divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:26px 0 20px;
    color:#666;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
}
.divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(212,175,55,.3);
}

.register{
    text-align:center;
    color:#ccc;
    font-size:14px;
}

.register a{
    color:#FFD700;
    text-decoration:none;
    font-weight:600;
}

.register a:hover{
    text-decoration:underline;
}
.back{
    text-align:center;
    margin-top:18px;
}
.back a{
    color:#888;
    text-decoration:none;
    font-size:13px;
}
.back a:hover{
    color:#FFD700;
}

.alert-login{
    display:none;
    margin-bottom:20px;
    border-radius:12px;
    font-size:14px;
    padding:12px 15px;
}

@media(max-width:480px){
.login-card{
padding:32px 24px;
}
.logo img{
width:110px;
height:110px;
}
.logo h1{
font-size:24px;
}
}

</style>
</head>
<body>
<div class="login-box">
<div class="login-card">
<div class="logo">
<img src="https://i.ibb.co/ksnQRFq5/logo.jpg" alt="Logo Barbería">
<div class="eyebrow">Acceso de clientes</div>
<h1>Barbería Élite del Estilo</h1>
<p>Bienvenido nuevamente</p>
</div>

<div class="alert alert-danger alert-login" id="alertaError">
<i class="bi bi-exclamation-triangle-fill"></i>
<span id="mensajeError">Por favor completa todos los campos.</span>
</div>

<form id="formLogin" autocomplete="off">

<label class="form-label">Correo electrónico</label>
<div class="input-group">
<span class="input-group-text">
<i class="bi bi-envelope-fill"></i>
</span>
<input
type="email"
id="email"
class="form-control"
placeholder="Ingresa tu correo"
autocomplete="off"
required>
</div>

<label class="form-label">Contraseña</label>
<div class="password-box mb-3">
<input
type="password"
id="password"
class="form-control"
placeholder="Ingresa tu contraseña"
autocomplete="new-password"
required>
<i class="bi bi-eye-fill eye" onclick="mostrarPassword()"></i>
</div>

<div class="options">
<div class="form-check">
<input class="form-check-input" type="checkbox" id="recordarme">
<label class="form-check-label" for="recordarme">
Recordarme
</label>
</div>
<a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
</div>

<button type="button" class="btn btn-login" id="btnLogin">
    <i class="bi bi-box-arrow-in-right"></i>
    Iniciar Sesión
</button>

</form>

<div class="divider">o</div>

<div class="register">
¿No tienes cuenta?
<a href="registro.html">Crear cuenta</a>
</div>

<div class="back">
<a href="barberia.html">
← Volver al inicio
</a>
</div>

</div>
</div>
<script>

// ======================
// SEMBRAR CUENTA ADMINISTRADORA POR DEFECTO
// ======================
// Si nunca se ha creado un administrador, se crea una cuenta de prueba
// para que siempre exista una forma de entrar al panel de administración.
// OJO: estas cuentas de prueba viven solo en localStorage, no en el
// backend/Postgres, por eso el login primero valida contra localStorage
// y solo usa el backend como respaldo para cuentas reales.
(function sembrarCuentasDePrueba(){
    const registrados = JSON.parse(localStorage.getItem("usuariosRegistrados") || "[]");
    let cambiado = false;

    const existeAdmin = registrados.some(u => u.rol === "administrador");
    if(!existeAdmin){
        registrados.push({
            nombre: "Sofia",
            usuario: "admin",
            correo: "admin@eliteestilo.com",
            telefono: "",
            nacimiento: "",
            password: "admin123",
            rol: "administrador"
        });
        cambiado = true;
    }

    // Cuenta de barbero de prueba, vinculada al primer barbero por defecto.
    const existeBarbero = registrados.some(u => u.rol === "barbero");
    if(!existeBarbero){
        registrados.push({
            nombre: "Julián Restrepo",
            usuario: "barbero",
            correo: "barbero@eliteestilo.com",
            telefono: "",
            nacimiento: "",
            password: "barbero123",
            rol: "barbero",
            barberoNombre: "Julián Restrepo"
        });
        cambiado = true;
    }

    if(cambiado) localStorage.setItem("usuariosRegistrados", JSON.stringify(registrados));
})();

function mostrarPassword(){
    let input = document.getElementById("password");
    let icono = document.querySelector(".eye");
    if(input.type === "password"){
        input.type = "text";
        icono.classList.remove("bi-eye-fill");
        icono.classList.add("bi-eye-slash-fill");
    }else{
        input.type = "password";
        icono.classList.remove("bi-eye-slash-fill");
        icono.classList.add("bi-eye-fill");
    }
}

function mostrarError(mensaje){
    const alerta = document.getElementById("alertaError");
    document.getElementById("mensajeError").textContent = mensaje;
    alerta.style.display = "block";
}

function ocultarError(){
    document.getElementById("alertaError").style.display = "none";
}

function validarEmail(correo){
    const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    return regex.test(correo);
}

// Redirige según el rol de la sesión ya guardada en localStorage
function redirigirSegunRol(rol){
    if(rol === "administrador"){
        window.location.href = "administrador.html";
    }else if(rol === "barbero"){
        window.location.href = "panel-barbero.html";
    }else{
        window.location.href = "barberia.html";
    }
}

// BOTÓN INICIAR SESIÓN
document.getElementById("btnLogin").addEventListener("click", async function () {

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const btn = document.getElementById("btnLogin");

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    emailInput.classList.remove("is-invalid");
    passwordInput.classList.remove("is-invalid");
    ocultarError();

    if(email === "" || password === ""){
        if(email === "") emailInput.classList.add("is-invalid");
        if(password === "") passwordInput.classList.add("is-invalid");
        mostrarError("Por favor completa todos los campos.");
        return;
    }

    if(!validarEmail(email)){
        emailInput.classList.add("is-invalid");
        mostrarError("Ingresa un correo electrónico válido.");
        return;
    }

    if(password.length < 4){
        passwordInput.classList.add("is-invalid");
        mostrarError("La contraseña debe tener al menos 4 caracteres.");
        return;
    }

    // 1) Intento local: cubre las cuentas de prueba (admin/barbero) y
    //    cualquier cuenta ya guardada en localStorage.
    const registrados = JSON.parse(localStorage.getItem("usuariosRegistrados") || "[]");
    const encontradoLocal = registrados.find(u => u.correo === email && u.password === password);

    if(encontradoLocal){
        if(encontradoLocal.bloqueado){
            mostrarError("Esta cuenta está bloqueada. Contacta a la barbería para más información.");
            return;
        }

        const sesion = {
            nombre: encontradoLocal.nombre,
            usuario: encontradoLocal.usuario,
            correo: encontradoLocal.correo,
            rol: encontradoLocal.rol || "cliente"
        };
        if(encontradoLocal.rol === "barbero"){
            sesion.barberoNombre = encontradoLocal.barberoNombre;
        }
        localStorage.setItem("usuario", JSON.stringify(sesion));
        redirigirSegunRol(sesion.rol);
        return;
    }

    // 2) Si no hay coincidencia local, se intenta contra el backend
    //    (cuentas de clientes creadas en Postgres).
    btn.disabled = true;

    try {
        const respuesta = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                correo: email,
                contraseña: password
            })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            mostrarError(datos.error || "Correo o contraseña incorrectos.");
            btn.disabled = false;
            return;
        }

        const sesion = {
            id_usuario: datos.id_usuario,
            nombre: datos.nombre,
            correo: datos.correo,
            estado: datos.estado,
            rol: "cliente"
        };
        localStorage.setItem("usuario", JSON.stringify(sesion));
        window.location.href = "barberia.html";

    } catch (error) {
        console.error("Error:", error);
        mostrarError("Correo o contraseña incorrectos, o no se pudo conectar con el servidor.");
        btn.disabled = false;
    }
});

</script>
</body>

</html>
